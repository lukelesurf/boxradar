; BOXRADAR v2 — ESP32-2432S028R "Cheap Yellow Display"

[env]
platform = espressif32 @ ^6.4.0
board = esp32dev
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    ; registry only has an untagged alpha of this lib — pin the git tag instead
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.1.0

; TFT_eSPI configured here, not User_Setup.h (clobbered by lib updates).
; CYD standard set — if colours are wrong it's the batch variant:
; swap ILI9341_2_DRIVER <-> ILI9341_DRIVER and/or add -DTFT_INVERSION_ON.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:usb]
; first flash / recovery over serial

[env:ota]
upload_protocol = espota
; DHCP-reserved address — host has no mDNS resolver for boxradar.local
upload_port = 192.0.2.20
; espota makes the BOARD connect back to the host to pull the image —
; pin the port so the host firewall can allow it
upload_flags =
    --auth=${sysenv.BOXRADAR_OTA_PASS}
    --host_port=3232
