; BOXRADAR v2 — ESP32-2432S028R "Cheap Yellow Display"

[env]
; shared by all envs (incl. native tests): portable libs only
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0

[esp32_base]
platform = espressif32 @ ^6.4.0
board = esp32dev
framework = arduino
; min_spiffs keeps BOTH OTA slots (which is what makes OTA safe) and grows
; each from 1.25 to 1.875 MiB, taking the space from a SPIFFS partition this
; project never touches. Do NOT switch to huge_app: that is a single app
; slot and removes OTA entirely. See SPEC.md for the numbers.
;
; Changing this cannot be applied over OTA — espota writes an app image into
; the inactive slot and never rewrites the partition table at 0x8000, and
; app1's offset moves. It needs a USB flash, preceded by an erase so the
; bootloader cannot try to boot a stale otadata pointer at the old offset.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
    ; registry only has an untagged alpha of this lib — pin the git tag instead
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; TFT_eSPI configured here, not User_Setup.h (clobbered by lib updates).
; This board's batch: ILI9341_2_DRIVER + inversion (verified on hardware).
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------------
; One env per board. The site flag and the upload target live in the same
; section on purpose: a board's firmware carries its home coordinates, and a
; blob built for a different home is rejected outright (GEO_HOME_TOLERANCE_DEG
; in lib/radarcore/geoblob.h). Flashing the wrong pair does not fail loudly —
; the scope keeps drawing on a stale cached map — so the pairing is made
; impossible to get wrong rather than merely documented.
;
;   pio run -e southend      -t upload    over the air, the usual path
;   pio run -e southend-usb  -t upload    serial, first flash and recovery
;
; There is deliberately no site-less env: config.h #errors without a flag.
; ---------------------------------------------------------------------------

[ota_base]
extends = esp32_base
upload_protocol = espota
; espota makes the BOARD connect back to the host to pull the image —
; pinned port must be open in the host's firewall (TCP 3232). Run one at a time:
; "Listen Failed" means 3232 is still in TIME_WAIT, so wait 60s and retry.
upload_flags =
    --auth=${sysenv.BOXRADAR_OTA_PASS}
    --host_port=3232

[env:stansted]
extends = ota_base
; a DHCP-reserved name or address — espota needs to reach the board directly
upload_port = boxradar.lan
build_flags = ${esp32_base.build_flags} -DBOXRADAR_SITE_STANSTED

[env:stansted-usb]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DBOXRADAR_SITE_STANSTED

[env:southend]
extends = ota_base
upload_port = boxradar-southend.lan
build_flags = ${esp32_base.build_flags} -DBOXRADAR_SITE_SOUTHEND

[env:southend-usb]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DBOXRADAR_SITE_SOUTHEND

[env:native]
platform = native
; -I src so test_viewport can reach src/ui/viewport.h and layout.h. Those two
; are deliberately free of Arduino/TFT_eSPI includes — the projection maths is
; the part worth testing off-device, and keeping it linkable natively is what
; makes that possible.
build_flags = -std=gnu++17 -I src
test_build_src = no
