<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}BOXRADAR site{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0;
         line-height: 1.4; }
  header { padding: .8rem 1.2rem; border-bottom: 1px solid #8884;
           display: flex; gap: 1.2rem; align-items: baseline; }
  header b { font-size: 1.05rem; }
  header a { text-decoration: none; }
  header a.on { font-weight: 600; text-decoration: underline; }
  main { padding: 1.2rem; }
  .flash { padding: .6rem .9rem; margin: 0 0 .6rem; border-radius: 4px;
           border: 1px solid #8886; }
  .flash.error { border-color: #c0392b; background: #c0392b18; }
  .flash.ok { border-color: #2d8659; background: #2d865918; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: .25rem .5rem; text-align: left;
           border-bottom: 1px solid #8883; }
  th { position: sticky; top: 0; background: Canvas; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.picked { background: #2d865915; }
  .why { color: #8889; font-size: .82rem; }
  .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
         margin: 0 0 .8rem; }
  label.f { display: block; margin: .7rem 0 .2rem; font-size: .9rem; }
  input[type=text] { padding: .45rem; font-size: 1rem; width: 14rem;
                     box-sizing: border-box; }
  button { padding: .45rem .9rem; font-size: .95rem; }
  p.note { color: #8889; font-size: .85rem; max-width: 42rem; }
</style>

<header>
  <b>BOXRADAR</b>
  <a href="{{ url_for('site') }}"
     class="{{ 'on' if page == 'site' }}">Site</a>
  <a href="{{ url_for('airspace') }}"
     class="{{ 'on' if page == 'airspace' }}">Airspace</a>
</header>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  {% block body %}{% endblock %}
</main>
